sonar.projectKey=CBX1_hotglue-transformation-scripts
sonar.python.version=3.12
sonar.sources=hubspot
sonar.tests=hubspot/tests
sonar.test.inclusions=hubspot/tests/**
# Tests are analysed as tests; sync-output/, snapshots/ and etl-output/ are job data.
sonar.exclusions=hubspot/tests/**,hubspot/sync-output/**,hubspot/snapshots/**,hubspot/etl-output/**,etl-output/**
sonar.python.coverage.reportPaths=coverage.xml
sonar.ci.autoconfig.disabled=true
